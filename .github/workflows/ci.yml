name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go test (${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # go.mod: the minimum version README.md promises builds from source.
        # stable: the current release, where govulncheck's stdlib findings are meaningful.
        go: [go.mod, stable]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go (go.mod minimum)
        if: matrix.go == 'go.mod'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Go (stable)
        if: matrix.go == 'stable'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint shell scripts
        run: shellcheck skills/google-messages/scripts/check-runtime.sh

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Report coverage summary
        if: matrix.go == 'stable'
        run: |
          {
            echo "### Test Coverage Summary"
            echo '```'
            go tool cover -func=coverage.out | tail -n 25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Browser sign-in fixture
        env:
          GMCLI_BROWSER_TEST: "1"
        run: go test -race ./internal/browserauth

      # govulncheck reports standard-library findings against the running
      # toolchain, so it only runs on stable; the go.mod minimum would fail on
      # stdlib advisories already fixed in newer patch releases.
      - name: Install govulncheck
        if: matrix.go == 'stable'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Vulnerability audit
        if: matrix.go == 'stable'
        run: |
          set -o pipefail
          status=0
          govulncheck ./... | tee /tmp/govulncheck.txt || status=$?
          {
            echo "### Vulnerability Audit (govulncheck)"
            echo '```'
            cat /tmp/govulncheck.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
